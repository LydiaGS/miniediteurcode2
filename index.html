  min-height: 100vh;
  display: flex;
  flex-direction: column;

  align-items: center;
  background: #1a1a2e;
  perspective: 1000px;

.scene {
  width: 200px;
  height: 200px;
  perspective: 600px;
}

.cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(-20deg) rotateY(30deg);
  transition: transform 1s;
}

.scene:hover .cube {
  transform: rotateX(20deg) rotateY(-30deg) rotateZ(10deg);
}

.face {
  position: absolute;
  width: 200px;
  height: 200px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Arial', sans-serif;
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
  border: 2px solid rgba(255,255,255,0.3);
}

.front  { background: rgba(255,0,0,0.7); transform: translateZ(100px); }
.back   { background: rgba(0,255,0,0.7); transform: rotateY(180deg) translateZ(100px); }
.right  { background: rgba(0,0,255,0.7); transform: rotateY(90deg) translateZ(100px); }
.left   { background: rgba(255,255,0,0.7); transform: rotateY(-90deg) translateZ(100px); }
.top    { background: rgba(255,0,255,0.7); transform: rotateX(90deg) translateZ(100px); }
.bottom { background: rgba(0,255,255,0.7); transform: rotateX(-90deg) translateZ(100px); }

.info {
  margin-top: 3rem;
  color: #888;

  margin: 0;
  padding: 0;

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
  min-height: 100vh;
  padding: 2rem;
  display: flex;
  justify-content: center;
}

.todo-app {
  background: white;
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

h1 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #333;
}

.input-container {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s;
}

input:focus {
  outline: none;
  border-color: #2a5298;
}

button {
  padding: 12px 20px;
  background: #2a5298;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.2rem;
  transition: background 0.3s;
}

button:hover {
  background: #1e3c72;
}

ul {
  list-style: none;
  margin-bottom: 1rem;
}

li {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #f5f5f5;
  margin-bottom: 8px;
  border-radius: 8px;
  transition: all 0.3s;
}

li:hover {
  background: #e8e8e8;
}

li.done {
  text-decoration: line-through;
  opacity: 0.6;
}

li input[type="checkbox"] {
  margin-right: 12px;
  width: 20px;
  height: 20px;
  cursor: pointer;
}

li span {
  flex: 1;
}

li .delete-btn {
  background: #ff4757;
  padding: 6px 12px;
  font-size: 0.9rem;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 1rem;
  border-top: 1px solid #e0e0e0;
}

#count {
  color: #666;
}

#clearBtn {
  background: #ff6b6b;
  padding: 8px 16px;
  font-size: 0.9rem;
}`,js:`const todoInput = document.getElementById('todoInput');
const addBtn = document.getElementById('addBtn');
const todoList = document.getElementById('todoList');
const countSpan = document.getElementById('count');
const clearBtn = document.getElementById('clearBtn');

let todos = [];

function updateCount() {
  const remaining = todos.filter(t => !t.done).length;
  countSpan.textContent = remaining + ' tâche' + (remaining > 1 ? 's' : '');
}

function renderTodos() {

let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 0, dy = 0;
let score = 0;
let gameLoop;
let gameRunning = false;

function drawGame() {
  // Clear canvas
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw grid
  ctx.strokeStyle = '#2a2a4e';
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }
  
  // Draw food
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Draw snake
  snake.forEach((segment, index) => {
    ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc6a';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = index === 0 ? 15 : 5;
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
  ctx.shadowBlur = 0;
}

function moveSnake() {
  if (dx === 0 && dy === 0) return;
  
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  
  // Check walls
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }
  
  // Check self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }
  
  snake.unshift(head);
  
  // Check food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreSpan.textContent = score;
    placeFood();
    console.log('🍎 +10 points! Score:', score);
  } else {
    snake.pop();
  }
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
}
